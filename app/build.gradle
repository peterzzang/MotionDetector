plugins {
    id 'com.android.application'
    // NOTE: 'org.jetbrains.kotlin.android' is intentionally NOT applied here.
    // AGP 9+ compiles Kotlin sources itself ("built-in Kotlin"). Applying the
    // old Kotlin Gradle plugin on top of that causes a build failure:
    // "Cannot add extension with name 'kotlin', as there is an extension
    // already registered with that name."
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.example.motiondetector'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.motiondetector"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // NOTE: no `kotlinOptions { jvmTarget = ... }` block. With AGP's built-in
    // Kotlin, the Kotlin JVM target automatically follows
    // compileOptions.targetCompatibility above (both are 17), so it doesn't
    // need to be set separately via the newer kotlin { compilerOptions {} }
    // DSL. If you ever need to set it explicitly, use:
    //   kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

    buildFeatures {
        viewBinding true
    }

    // Avoid the TFLite .tflite model file being compressed inside the APK
    // (current DSL; replaces the removed legacy `aaptOptions` block)
    androidResources {
        noCompress += "tflite"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // CameraX
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-video:$camerax_version"

    // TensorFlow Lite Task Vision (object detection)
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'
    // NOTE: tensorflow-lite-gpu is intentionally NOT included. Our code never
    // uses the GPU delegate (MainActivity only sets numThreads on CPU), and
    // that artifact's manifest declares the same namespace ("org.tensorflow.lite")
    // as the transitively-pulled tensorflow-lite-api artifact. AGP 9 treats
    // that duplicate namespace as a hard manifest-merge error, so we simply
    // don't pull in the unused GPU artifact. If you later add GPU delegate
    // support, you'll need a different fix (e.g. excluding the duplicate
    // transitive dependency) rather than re-adding this line as-is.

    // Room database (detection history, searchable) - uses KSP, not kapt.
    // NOTE: must be 2.7.0+ - Room 2.6.x has a known KSP2 incompatibility
    // ("unexpected jvm signature V") with suspend DAO functions returning Unit.
    def room_version = "2.8.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
